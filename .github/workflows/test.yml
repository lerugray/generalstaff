name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      # Explicit per-test limit: Windows runners run the git-backed co-seat tests close to bun's
      # 5 s default (4.9 s observed 2026-11-07), so they failed whenever a runner was slow.
      - run: bun test --timeout 30000
      # Date-bomb check (v0.18.1): the co-seat suites that take their clock by
      # injection run again with the system clock 400 days ahead, so a test
      # that mixes a fixed date with the real clock fails now, not on the day
      # the dates drift apart. Suites that poll the clock or compare against
      # real file times (driver, lock, park, turn) are left out.
      - name: Co-seat tests with the clock 400 days ahead
        env:
          GENERALSTAFF_TEST_CLOCK_SKEW_DAYS: "400"
        run: bun test --timeout 30000 tests/co_seat/cli.test.ts tests/co_seat/config.test.ts tests/co_seat/control.test.ts tests/co_seat/ctl.test.ts tests/co_seat/events.test.ts tests/co_seat/guards.test.ts tests/co_seat/meter.test.ts
      - run: bun run typecheck

  # install.sh smoke (unix only). Windows has install.ps1 but this job
  # only covers the shell installer; the matrix above still runs the
  # full suite on windows-latest.
  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Run install.sh in a temp HOME
        run: |
          set -euo pipefail
          TMP_HOME="$(mktemp -d)"
          export HOME="$TMP_HOME"
          # setup-bun already put bun on PATH; don't re-install it.
          GENERALSTAFF_DIR="${TMP_HOME}/GeneralStaff" \
          GENERALSTAFF_NO_BUN_INSTALL=1 \
          GENERALSTAFF_UPDATE_PATH=yes \
            bash "${GITHUB_WORKSPACE}/install.sh"
          export PATH="${HOME}/.local/bin:${PATH}"
          generalstaff --version
          generalstaff --help >/dev/null
